name: Blip Droplet CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blip-droplet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode Installations ==="
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            SELECTED_XCODE="/Applications/Xcode_16.2.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            SELECTED_XCODE="/Applications/Xcode_16.1.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            SELECTED_XCODE="/Applications/Xcode_16.0.app/Contents/Developer"
          else
            SELECTED_XCODE="/Applications/Xcode.app/Contents/Developer"
          fi
          sudo xcode-select -s "$SELECTED_XCODE"
          echo "DEVELOPER_DIR=$SELECTED_XCODE" >> "$GITHUB_ENV"
          echo "Selected: $SELECTED_XCODE"
          xcodebuild -version
          swift --version

      - name: Build and validate Blip.droplet
        run: bash cloud-build/build-blip-droplet-ci.sh

      - name: Upload validated droplet bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blip-droplet-${{ github.run_id }}
          path: cloud-build/dist/Blip.droplet.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence and linkage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blip-build-evidence-${{ github.run_id }}
          path: cloud-build/evidence/
          if-no-files-found: warn
          retention-days: 14
